##
## Unit Tests & Coverage
##
name: test
on:
  pull_request:
    types:
      - opened
      - synchronize

  push:
    branches:
      - main
      - /refs/heads/main

jobs:

  unit:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      ## the toolchain is defined by go.mod, CI never drifts from the module
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      ## the examples (directory example/) are tested too
      - name: go test
        run: go test -race -coverpkg=./... -coverprofile=profile.cov ./...

      ## internal/optics writes struct fields through unsafe.Pointer
      - name: go test checkptr
        run: go test -gcflags=all=-d=checkptr ./internal/... .

      - uses: shogo82148/actions-goveralls@v1
        continue-on-error: true
        with:
          path-to-profile: profile.cov
